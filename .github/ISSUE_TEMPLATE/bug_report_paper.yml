name: Bug Report (Paper)
description: Report a bug or unexpected behavior on a Paper server
labels: ["Type: bug", "Module: Paper"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us fix the issue.

        If your server runs **Folia**, or if the problem involves a **Velocity** proxy (cross-server chat or cross-server direct messages), please use the corresponding template instead.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug you encountered...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run command '...'
        2. Send message '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what you expected to happen...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: LunaticChat Version
      description: Run `/lc status` in-game to see the version and commit hash.
      placeholder: "e.g., v1.3.0 (7c54422)"
    validations:
      required: true

  - type: input
    id: paper-version
    attributes:
      label: Paper Version
      description: Run `/version` on the server.
      placeholder: "e.g., Paper 26.2-92"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: What version of Minecraft are you running?
      placeholder: "e.g., 26.2"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: LunaticChat requires Java 25 or later.
      placeholder: "e.g., Java 25"
    validations:
      required: true

  - type: checkboxes
    id: enabled-features
    attributes:
      label: Enabled Features
      description: Which optional features are enabled in `config.yml`? Most of them are off by default.
      options:
        - label: "`features.quickReplies` (/reply)"
        - label: "`features.japaneseConversion` (romaji to Japanese)"
        - label: "`features.channelChat`"
        - label: "`features.velocityIntegration`"

  - type: textarea
    id: diagnostics
    attributes:
      label: Output of `/lc dump`
      description: "Run `/lc dump` on the affected server and paste the report it writes to `plugins/LunaticChat/debug/`. It carries the versions, the enabled features and how full each store is - no player names, UUIDs or messages."
      placeholder: Paste the report here...
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: "Please paste relevant logs or error messages here. Setting `debug: true` in `config.yml` produces more detail; `debug: velocity,protocol` (or `/lc debug <category> on`) narrows it to one area."
      placeholder: Paste your logs here...
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, other installed plugins, related issues, etc.)
      placeholder: Any additional information...
    validations:
      required: false
