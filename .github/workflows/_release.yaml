name: Release (shared)

on:
  workflow_call:
    inputs:
      platform:
        description: "paper or velocity"
        required: true
        type: string
      modrinth-game-versions:
        description: "Newline-separated Minecraft versions listed on Modrinth"
        required: true
        type: string
      modrinth-mc-version:
        description: "Minecraft version shown in the Modrinth version name (paper only)"
        required: false
        type: string
        default: ""
    secrets:
      MODRINTH_TOKEN:
        required: true
      MODRINTH_PROJECT_ID:
        required: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      jar_name: ${{ steps.get_version.outputs.jar_name }}
      module: ${{ steps.get_version.outputs.module }}
      label: ${{ steps.get_version.outputs.label }}
      modrinth_name: ${{ steps.get_version.outputs.modrinth_name }}
      modrinth_version: ${{ steps.get_version.outputs.modrinth_version }}
      modrinth_loaders: ${{ steps.get_version.outputs.modrinth_loaders }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version from tag and validate
        id: get_version
        env:
          PLATFORM: ${{ inputs.platform }}
          MC_VERSION: ${{ inputs.modrinth-mc-version }}
        run: |
          # Paper keeps the bare vX.Y.Z tag so that UpdateChecker in already-deployed
          # Paper builds, which strips only a leading "v", keeps recognising new releases.
          case "$PLATFORM" in
            paper)
              TAG_PREFIX="v"
              VERSION_FILE="version.txt"
              JAR_SUFFIX=""
              MODULE="platform-paper"
              LABEL="Paper/Folia"
              ;;
            velocity)
              TAG_PREFIX="velocity/v"
              VERSION_FILE="platform-velocity/version.txt"
              JAR_SUFFIX="-velocity"
              MODULE="platform-velocity"
              LABEL="Velocity"
              ;;
            *)
              echo "Error: unknown platform '$PLATFORM'"
              exit 1
              ;;
          esac

          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ ! "$TAG_NAME" =~ ^${TAG_PREFIX}[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag $TAG_NAME does not match ${TAG_PREFIX}X.Y.Z"
            exit 1
          fi

          TAG_VERSION=${TAG_NAME#"$TAG_PREFIX"}
          FILE_VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match $VERSION_FILE ($FILE_VERSION)"
            exit 1
          fi

          if [ "$PLATFORM" = "paper" ]; then
            MODRINTH_NAME="v${TAG_VERSION} (${LABEL} v${MC_VERSION})"
            MODRINTH_VERSION="$TAG_VERSION"
            MODRINTH_LOADERS=$'paper\nfolia'
          else
            MODRINTH_NAME="v${TAG_VERSION} (${LABEL})"
            MODRINTH_VERSION="${TAG_VERSION}-velocity"
            MODRINTH_LOADERS="velocity"
          fi

          {
            echo "version=$TAG_VERSION"
            echo "jar_name=LunaticChat-${TAG_VERSION}${JAR_SUFFIX}.jar"
            echo "module=$MODULE"
            echo "label=$LABEL"
            echo "modrinth_name=$MODRINTH_NAME"
            echo "modrinth_version=$MODRINTH_VERSION"
            echo "modrinth_loaders<<EOF"
            echo "$MODRINTH_LOADERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Version validation passed: $TAG_NAME"

      # Only a published Release blocks a re-run. A draft is what an earlier run leaves behind
      # when a later step failed, and the release job knows how to pick it up again.
      - name: Check that the release is not already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if is_draft=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$is_draft" = "false" ]; then
              echo "Error: Release $TAG_NAME is already published"
              exit 1
            fi
            echo "Draft Release $TAG_NAME exists from an earlier run and will be reused"
          fi

  build:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Development Environment
        uses: jdx/mise-action@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build shadowJar
        run: ./gradlew :${{ needs.validate.outputs.module }}:shadowJar --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LunaticChat-${{ inputs.platform }}-v${{ needs.validate.outputs.version }}
          path: ${{ needs.validate.outputs.module }}/build/libs/${{ needs.validate.outputs.jar_name }}
          retention-days: 90

  # Everything that can still stop a release runs here, before the first thing is published.
  verify:
    runs-on: ubuntu-24.04
    needs: [validate, build]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Development Environment
        uses: jdx/mise-action@v4

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: LunaticChat-${{ inputs.platform }}-v${{ needs.validate.outputs.version }}
          path: ${{ needs.validate.outputs.module }}/build/libs

      - name: Check the JAR carries this commit's protocol version
        env:
          JAR_PATH: ${{ needs.validate.outputs.module }}/build/libs/${{ needs.validate.outputs.jar_name }}
        run: .github/scripts/check-jar-protocol.sh "$JAR_PATH"

      - name: Wait for the docs deploy of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-docs-deploy.sh "$GITHUB_SHA"

  release:
    runs-on: ubuntu-24.04
    needs: [validate, build, verify]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ inputs.platform }}
      VERSION: ${{ needs.validate.outputs.version }}
      LABEL: ${{ needs.validate.outputs.label }}
      JAR_PATH: ${{ needs.validate.outputs.module }}/build/libs/${{ needs.validate.outputs.jar_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: LunaticChat-${{ inputs.platform }}-v${{ needs.validate.outputs.version }}
          path: ${{ needs.validate.outputs.module }}/build/libs

      # The text people write in the Release PR is the only copy; both the GitHub Release and
      # the Modrinth changelog are rendered from it.
      - name: Render the release notes
        run: .github/scripts/render-release-notes.sh "$PLATFORM" "$VERSION" > "$RUNNER_TEMP/notes.md"

      # Created as a draft, so "latest" is decided when it is published, not here:
      # GitHub makes a newly published release the latest one unless told otherwise.
      - name: Create GitHub Release as a draft
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$JAR_PATH" --clobber
            gh release edit "$TAG_NAME" --title "v${VERSION} (${LABEL})" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG_NAME" "$JAR_PATH" \
              --title "v${VERSION} (${LABEL})" \
              --draft \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          MODRINTH_LOADERS: ${{ needs.validate.outputs.modrinth_loaders }}
          MODRINTH_GAME_VERSIONS: ${{ inputs.modrinth-game-versions }}
          MODRINTH_NAME: ${{ needs.validate.outputs.modrinth_name }}
          MODRINTH_VERSION: ${{ needs.validate.outputs.modrinth_version }}
        run: |
          .github/scripts/publish-modrinth.sh \
            "$JAR_PATH" "$MODRINTH_VERSION" "$MODRINTH_NAME" "$RUNNER_TEMP/notes.md"

      # Published last: nothing is public on GitHub until Modrinth has the version too.
      - name: Publish the GitHub Release
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [ "$PLATFORM" = "velocity" ]; then
            gh release edit "$TAG_NAME" --draft=false --latest=false
          else
            gh release edit "$TAG_NAME" --draft=false --latest
          fi

  verify-rollout:
    runs-on: ubuntu-24.04
    needs: [validate, release]
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      MODRINTH_LOADERS: ${{ needs.validate.outputs.modrinth_loaders }}
      MODRINTH_GAME_VERSIONS: ${{ inputs.modrinth-game-versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify the rollout
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ needs.validate.outputs.version }}
          MODRINTH_VERSION: ${{ needs.validate.outputs.modrinth_version }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          .github/scripts/verify-rollout.sh "$TAG_NAME" "$PLATFORM" "$VERSION" "$MODRINTH_VERSION"

      - name: Open an issue when the rollout is wrong
        if: failure()
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh issue create \
            --title "Release ${TAG_NAME}: rollout verification failed" \
            --body "The release workflow published ${TAG_NAME}, but the checks afterwards failed. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
