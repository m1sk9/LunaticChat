name: Release Velocity

on:
  push:
    tags:
      - 'velocity/v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release again (recovery after a failed run)"
        required: true
        type: string

jobs:
  release:
    uses: ./.github/workflows/_release.yaml
    permissions:
      contents: write
      issues: write
      actions: read
    with:
      tag: ${{ inputs.tag }}
      platform: velocity
      modrinth-game-versions: |-
        1.21.x
        26.1.x
        26.2.x
        26.3.x
    secrets: inherit
